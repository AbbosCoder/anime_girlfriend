<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aiko</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="bubble" class="hidden"><div id="bubbleText"></div></div>
  <div id="heard" class="hidden"></div>

  <div id="log"></div>

  <form id="bar" autocomplete="off">
    <button type="button" id="mic" title="Gapirish (bosing, yana bosib yuboring)">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      <span id="micRing"></span>
    </button>
    <input id="text" placeholder="Aikoga yozing..." maxlength="1000" />
    <button type="submit" id="send" title="Yuborish">
      <svg viewBox="0 0 24 24"><path d="M3 20.5 21 12 3 3.5v6.6l12 1.9-12 1.9z"/></svg>
    </button>
  </form>

  <button id="gear" title="Sozlamalar">⚙</button>
  <div id="settings" class="hidden">
    <h3>Sozlamalar</h3>
    <label>Ovoz
      <select id="voice">
        <option>Leda</option><option>Kore</option><option>Aoede</option><option>Zephyr</option>
        <option>Callirrhoe</option><option>Despina</option><option>Laomedeia</option><option>Autonoe</option>
      </select>
    </label>
    <label class="row"><input type="checkbox" id="voiceOn" checked /> Ovoz bilan javob bersin</label>
    <label>O'z modelingiz (.vrm)
      <input type="file" id="vrmFile" accept=".vrm" />
    </label>
    <p class="hint">VRoid Studio'da qiz yarating yoki VRoid Hub'dan .vrm yuklab oling. Faylni ekranga sudrab tashlasangiz ham bo'ladi.</p>
    <button id="forget" type="button">Xotirani tozalash</button>
    <div id="memoryView"></div>
  </div>

  <div id="start">
    <div class="card">
      <div class="logo">🌸</div>
      <h1>Aiko</h1>
      <p id="loadText">Yuklanmoqda...</p>
      <div class="progress"><div id="progressBar"></div></div>
      <button id="startBtn" disabled>Tanishish</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
